name: ci
on: [push, pull_request]
jobs:
  peephole:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Install TinyGo 0.39.0
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo_0.39.0_amd64.deb
          sudo dpkg -i tinygo_0.39.0_amd64.deb
      - run: make vela
      - run: make apps
      - run: go test ./...
      - name: Privacy conformance — reference app (expected FAIL until fixed upstream)
        run: ./bin/peephole -policy specs/nova.json -app apps/nova.wasm -scenario nova || true
      - name: Demo — leaky example fails, hardened example passes (gates the build)
        run: make demo
      - name: Privacy conformance — Vela sample app (expected FAIL until fixed upstream)
        run: make check-simple || true
